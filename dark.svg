<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Himanshu Kumar GitHub profile banner">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#030712"/><stop offset=".5" stop-color="#07111f"/><stop offset="1" stop-color="#030712"/>
<animate attributeName="x1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;0;1" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/>
<animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="violet"><stop offset="0" stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<radialGradient id="cyan"><stop offset="0" stop-color="#22D3EE" stop-opacity=".20"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="1178" height="608" rx="30"/></clipPath>
</defs>
<rect width="1180" height="610" rx="30" fill="url(#bg)"/>
<circle cx="180" cy="70" r="260" fill="url(#violet)" filter="url(#glow)"/>
<circle cx="1020" cy="500" r="300" fill="url(#cyan)" filter="url(#glow)"/>
<g clip-path="url(#clip)">
<g opacity=".45">
<circle cx="95" cy="100" r="2" fill="#22D3EE"><animateTransform attributeName="transform" type="translate" values="0 0;18 20;0 0" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="130" r="1.7" fill="#7C3AED"><animateTransform attributeName="transform" type="translate" values="0 0;-22 13;0 0" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="960" cy="570" r="2" fill="#10B981"><animateTransform attributeName="transform" type="translate" values="0 0;15 -18;0 0" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="540" r="1.5" fill="#22D3EE"><animateTransform attributeName="transform" type="translate" values="0 0;-15 -10;0 0" dur="9s" repeatCount="indefinite"/></circle>
</g>
<rect x="28" y="28" width="1124" height="554" rx="24" fill="#0F172A" fill-opacity=".78" stroke="#FFFFFF" stroke-opacity=".10"/>
